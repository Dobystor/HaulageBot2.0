version: '3.8'

services:
  haulages_bot:
    build:
      context: ./haulages_bot
      dockerfile: Dockerfile
    image: developer.lasec.com.mx:5000/smartflow/services/haulages_bot/mastertwo:dev
    container_name: Haulages_Bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Puerto del host : puerto del contenedor
      - "${HOST_PORT:-5101}:80"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:80
      - ASPNETCORE_ENVIRONMENT=Production
      # Cadena de conexión a SQL Server (usa las variables del .env)
      - DefaultConnection=Server=${DB_SERVER};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=true;
      # Configuración de autenticación contra SmartFlow (variables planas)
      - ApiUrl=${API_URL:-https://dispatch-01-sf.smartflow.com.mx}
      - ClientId=${CLIENT_ID:-private.networking.app}
      - ClientSecret=${CLIENT_SECRET:-UxwYJsELeTnSc2Zz642K}
    volumes:
      # Persistir las llaves de Data Protection entre reinicios del contenedor
      - haulage_bot_keys:/var/keys
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  haulage_bot_keys:
    driver: local
